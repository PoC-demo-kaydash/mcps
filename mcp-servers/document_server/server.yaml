name: document_server
version: 1.0.0
description: 문서 생성/수정/삭제/조회 Tool 제공

# 서버 정보
server:
  type: mcp
  protocol: stdio
  language: python
  main_file: main.py
  class_name: DocumentServer

# 제공하는 Tool 목록
tools:
  - name: get_document
    description: 문서 상세 정보 조회
    category: document
    parameters:
      - name: user_id
        type: string
        required: true
        description: 사용자 ID
      - name: doc_id
        type: string
        required: true
        description: 문서 ID
    returns:
      type: object
      properties:
        doc_id:
          type: string
        title:
          type: string
        content:
          type: string
        classification:
          type: string
        created_at:
          type: string
        updated_at:
          type: string

  - name: create_document
    description: 새 문서 생성
    category: document
    parameters:
      - name: user_id
        type: string
        required: true
        description: 생성자 ID
      - name: title
        type: string
        required: true
        description: 문서 제목
      - name: content
        type: string
        required: true
        description: 문서 내용
      - name: classification
        type: string
        required: true
        description: 문서 등급 (public/team/confidential)
      - name: tags
        type: array
        required: false
        description: 태그 목록
    returns:
      type: object
      properties:
        success:
          type: boolean
        doc_id:
          type: string

  - name: update_document
    description: 문서 수정
    category: document
    parameters:
      - name: user_id
        type: string
        required: true
        description: 수정자 ID
      - name: doc_id
        type: string
        required: true
        description: 문서 ID
      - name: title
        type: string
        required: false
        description: 수정할 제목
      - name: content
        type: string
        required: false
        description: 수정할 내용
      - name: tags
        type: array
        required: false
        description: 수정할 태그
    returns:
      type: object
      properties:
        success:
          type: boolean

  - name: delete_document
    description: 문서 삭제 (soft delete)
    category: document
    parameters:
      - name: user_id
        type: string
        required: true
        description: 삭제자 ID
      - name: doc_id
        type: string
        required: true
        description: 문서 ID
    returns:
      type: object
      properties:
        success:
          type: boolean

  - name: list_documents
    description: 문서 목록 조회 (페이징)
    category: document
    parameters:
      - name: user_id
        type: string
        required: true
        description: 사용자 ID
      - name: classification
        type: string
        required: false
        description: 문서 등급 필터
      - name: page
        type: integer
        required: false
        description: 페이지 번호 (기본 1)
      - name: page_size
        type: integer
        required: false
        description: 페이지 크기 (기본 20)
    returns:
      type: object
      properties:
        documents:
          type: array
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer

# 의존성
dependencies:
  python: ">=3.10"
  packages:
    - pymysql==1.1.0
    - elasticsearch==8.11.1
    - pydantic==2.5.3
    - aiofiles==23.2.1

# 필요한 공유 모듈
shared_modules:
  - shared.database
  - shared.elasticsearch
  - shared.mcp_protocol
  - shared.logging_config
  - shared.permissions
  - mcp_tools.core.document_tools

# 환경 변수
environment:
  - MARIADB_HOST
  - MARIADB_PORT
  - MARIADB_USER
  - MARIADB_PASSWORD
  - MARIADB_DATABASE
  - ES_HOST
  - ES_USER
  - ES_PASSWORD
  - BASE_DIR

# 로그 설정
logging:
  level: INFO
  file: data/logs/mcp-servers/document_server.log
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

# 성능 지표
performance:
  startup_time: "<1s"
  avg_response_time: "<300ms"
  max_memory: "512MB"

# 헬스체크
health_check:
  enabled: true
  interval: 30
  timeout: 5
